name: Continuous Integration

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

# cancel superseded runs of a pull request; every push to master runs to the end
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOFLAGS: -mod=vendor

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    name: test - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.x
      - name: Test code
        shell: bash
        run: go test -race -coverprofile=coverage.txt ./...

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.x
      - name: Build linux binary
        run: GOOS=linux go build ./...
      - name: Build windows binary
        run: GOOS=windows go build ./...
      - name: Build darwin binary
        run: GOOS=darwin go build ./...

  check-codebase:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.x
      - name: Check Cheatsheet
        run: go run scripts/cheatsheet/main.go check
      - name: Check go.mod is tidy
        run: |
          GOFLAGS=-mod=mod go mod tidy
          git diff --exit-code go.mod go.sum || (echo "go.mod or go.sum is not tidy. Run 'go mod tidy' locally and commit the changes" && exit 1)
      - name: Check Vendor Directory
        # ensure our vendor directory matches up with our go modules
        run: |
          go mod vendor && git diff --exit-code || (echo "Unexpected change to vendor directory. Run 'go mod vendor' locally and commit the changes" && exit 1)

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.x
      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.x
      - name: Install govulncheck
        env:
          GOFLAGS: ""
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - name: Check for vulnerabilities
        # GO-2026-4887 and GO-2026-4883 are in github.com/docker/docker, which has no
        # fixed release; they are allowed until step 2 moves to moby/moby, and must
        # be removed from this list then. Any other reachable finding fails the job.
        run: |
          govulncheck -format json ./... > vuln.json
          unexpected=$(jq -r 'select(.finding != null and .finding.trace[0].function != null) | .finding.osv' vuln.json \
            | sort -u | grep -vxF -e GO-2026-4887 -e GO-2026-4883 || true)
          if [ -n "$unexpected" ]; then
            echo "New reachable vulnerabilities:"
            echo "$unexpected"
            govulncheck ./... || true
            exit 1
          fi
          echo "No reachable vulnerabilities besides the allowed docker/docker ones"

  goreleaser-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check goreleaser config
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.20.0
          args: check
